name: release-plugin
run-name: "插件${{ inputs.dry_run && '验证' || '发布' }} · ${{ inputs.display_version || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      display_version:
        description: "打包版本号（留空取 plugin.json）"
        default: ""
      auth_mode:
        description: "市场认证方式"
        type: choice
        options: [pat, oidc, login, shared]
        default: pat
      publish_market:
        description: "同步插件市场（dry-run 时仅检查配置，不上架）"
        type: boolean
        default: false
      dry_run:
        description: "仅构建和校验，不创建 Release、不提交市场"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 三个平台各建一份动态库。宿主按平台名挑 lib/<name>，
  # 文件名是宿主约定（macOS.dylib / Windows.dll / Linux.so），与 crate 名无关。
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            lib: macOS.dylib
          - os: ubuntu-latest
            lib: Linux.so
          - os: windows-latest
            lib: Windows.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> native/target
          key: native-${{ matrix.lib }}
      - name: 构建动态库
        shell: bash
        run: |
          set -euo pipefail
          cd native
          cargo build --release
          mkdir -p ../lib
          case "${{ matrix.lib }}" in
            macOS.dylib)  cp target/release/libotools_vm_native.dylib "../lib/${{ matrix.lib }}" ;;
            Linux.so)     cp target/release/libotools_vm_native.so     "../lib/${{ matrix.lib }}" ;;
            Windows.dll)  cp target/release/otools_vm_native.dll       "../lib/${{ matrix.lib }}" ;;
          esac
          ls -la ../lib
      - name: 单元测试
        run: cd native && cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.lib }}
          path: lib/${{ matrix.lib }}
          if-no-files-found: error
          retention-days: 14

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查与构建
        run: pnpm run build:check
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [build-native, build-frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      packid: ${{ steps.meta.outputs.packid }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_enabled: ${{ steps.meta.outputs.publish_enabled }}
      market_requested: ${{ steps.meta.outputs.market_requested }}
      market_enabled: ${{ steps.meta.outputs.market_enabled }}
      validate_release: ${{ steps.meta.outputs.validate_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验版本、标签和发布开关
        id: meta
        env:
          DISPLAY_VERSION: ${{ inputs.display_version }}
          RELEASE_SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_MARKET: ${{ inputs.publish_market }}
          AUTO_PUBLISH_MARKET: ${{ vars.OTOOLS_PUBLISH_MARKET || 'false' }}
        run: node scripts/publish-market.mjs meta
      - name: 发布脚本回归测试
        run: node --test scripts/*.test.mjs || true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: lib
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: 打包正式插件并生成摘要
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/pack-plugin.mjs --out dist-pack --version "$VERSION"
      - name: 独立验证插件包
        run: node scripts/verify-plugin.mjs dist-pack
      - uses: actions/upload-artifact@v4
        with:
          name: oplg
          path: |
            dist-pack/*.oplg
            dist-pack/plugin.json
            dist-pack/logo.svg
            dist-pack/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: 构建摘要
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PACKID: ${{ steps.meta.outputs.packid }}
          PUBLISH_ENABLED: ${{ steps.meta.outputs.publish_enabled }}
        run: |
          printf '### 插件构建完成\n- 插件：`%s`\n- 版本：`%s`\n- 允许正式发布：`%s`\n\n' "$PACKID" "$VERSION" "$PUBLISH_ENABLED" >> "$GITHUB_STEP_SUMMARY"
          cat dist-pack/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: package
    if: ${{ needs.package.outputs.validate_release == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: oplg
          path: release-assets
      - name: 发布前重新验证产物
        run: node scripts/verify-plugin.mjs release-assets
      - name: 检查市场凭证配置（不发送凭证、不上架）
        if: ${{ needs.package.outputs.market_requested == 'true' }}
        env:
          AUTH_MODE: ${{ inputs.auth_mode || vars.XYCLOUD_AUTH_MODE || 'pat' }}
          XYCLOUD_PAT: ${{ secrets.XYCLOUD_PAT }}
          XYCLOUD_LOGIN_TOKEN: ${{ secrets.XYCLOUD_LOGIN_TOKEN }}
          OTOOLS_MARKET_TOKEN: ${{ secrets.OTOOLS_MARKET_TOKEN }}
          XYCLOUD_OIDC_ISSUER: ${{ vars.XYCLOUD_OIDC_ISSUER }}
          XYCLOUD_PUBLISHER_ID: ${{ vars.XYCLOUD_PUBLISHER_ID }}
          OTOOLS_MARKET_API: ${{ vars.OTOOLS_MARKET_API || 'https://otools-api.lingyun.net/api/v1/otools/plugin/publish' }}
        run: node scripts/publish-market.mjs preflight
      - name: 核验发布标签与构建提交
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/release-policy.mjs
      - name: 发布 GitHub Release
        if: ${{ needs.package.outputs.publish_enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "$RELEASE_TAG" --notes "otools-vm v${RELEASE_VERSION}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.oplg release-assets/logo.svg release-assets/plugin.json release-assets/SHA256SUMS --clobber
      - name: 授权并提交市场
        if: ${{ needs.package.outputs.market_enabled == 'true' }}
        env:
          AUTH_MODE: ${{ inputs.auth_mode || vars.XYCLOUD_AUTH_MODE || 'pat' }}
          XYCLOUD_PAT: ${{ secrets.XYCLOUD_PAT }}
          XYCLOUD_LOGIN_TOKEN: ${{ secrets.XYCLOUD_LOGIN_TOKEN }}
          OTOOLS_MARKET_TOKEN: ${{ secrets.OTOOLS_MARKET_TOKEN }}
          XYCLOUD_OIDC_ISSUER: ${{ vars.XYCLOUD_OIDC_ISSUER }}
          XYCLOUD_OIDC_AUDIENCE: ${{ vars.XYCLOUD_OIDC_AUDIENCE || 'otools-ci' }}
          XYCLOUD_PUBLISHER_ID: ${{ vars.XYCLOUD_PUBLISHER_ID }}
          OTOOLS_MARKET_API: ${{ vars.OTOOLS_MARKET_API || 'https://otools-api.lingyun.net/api/v1/otools/plugin/publish' }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          PLUGIN_MANIFEST: release-assets/plugin.json
        run: node scripts/publish-market.mjs
